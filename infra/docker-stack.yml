# Docker Swarm stack file for 3-node deployment
# Deploy with: docker stack deploy -c docker-stack.yml alpaca-rl
#
# Node labels required:
#   server_1 (192.168.10.104): role=data     (Swarm Manager)
#   server_7 (192.168.10.113): role=compute  (Swarm Worker)
#   server_6 (192.168.10.105): role=trading  (Swarm Worker)
#
# Preserve infra/docker-compose.yml for local dev — this file is Swarm-only.

version: "3.8"

services:
  # ═══════════════════════════════════════════════════════════════════════
  # DATA NODE — server_1 (role=data)
  # ═══════════════════════════════════════════════════════════════════════

  postgres:
    image: timescale/timescaledb:latest-pg15
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER must be set}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      POSTGRES_DB: ${DB_NAME:?DB_NAME must be set}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    deploy:
      placement:
        constraints:
          - node.labels.role == data
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
      restart_policy:
        condition: any

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    networks:
      - backend
    deploy:
      placement:
        constraints:
          - node.labels.role == data
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
      restart_policy:
        condition: any

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - backend
    deploy:
      placement:
        constraints:
          - node.labels.role == data
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
      restart_policy:
        condition: any

  temporal:
    image: temporalio/auto-setup:1.24
    ports:
      - "7233:7233"
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${DB_USER:?DB_USER must be set}
      - POSTGRES_PWD=${DB_PASSWORD:?DB_PASSWORD must be set}
      - POSTGRES_SEEDS=postgres
    networks:
      - backend
    deploy:
      placement:
        constraints:
          - node.labels.role == data
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
      restart_policy:
        condition: any

  temporal-ui:
    image: temporalio/ui:latest
    ports:
      - "8080:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:8080
    networks:
      - backend
    deploy:
      placement:
        constraints:
          - node.labels.role == data
      resources:
        limits:
          memory: 128M
      restart_policy:
        condition: any

  # ═══════════════════════════════════════════════════════════════════════
  # TRADING NODE — server_6 (role=trading)
