        failure_action: rollback
        monitor: 30s
        order: start-first
      rollback_config:
        parallelism: 1
        order: start-first

  temporal-worker:
    image: ghcr.io/ntjohns1/alpaca-rl-suite/temporal-worker:latest
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_TASK_QUEUE: alpaca-rl-main
      RL_TRAIN_URL: http://rl-train:8004
      BACKTEST_URL: http://backtest:8001
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:?OTEL_EXPORTER_OTLP_ENDPOINT must be set}
    ports:
      - "8010:8010"
    networks:
      - backend
    deploy:
      placement:
        constraints:
          - node.labels.role == data
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M
      restart_policy:
        condition: any
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 30s
        order: start-first
      rollback_config:
        parallelism: 1
        order: start-first

  kaggle-orchestrator:
    image: ghcr.io/ntjohns1/alpaca-rl-suite/kaggle-orchestrator:latest
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT must be set}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET must be set}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set}
      KAGGLE_API_TOKEN: ${KAGGLE_API_TOKEN:?KAGGLE_API_TOKEN must be set}
      KEYCLOAK_URL: ${KEYCLOAK_URL:?KEYCLOAK_URL must be set}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:?KEYCLOAK_REALM must be set}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:?KEYCLOAK_CLIENT_ID must be set}
      KAGGLE_USERNAME: ${KAGGLE_USERNAME:?KAGGLE_USERNAME must be set}
      ENVIRONMENT: production
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:?OTEL_EXPORTER_OTLP_ENDPOINT must be set}
      KAGGLE_ORCHESTRATOR_PORT: "8011"
    ports:
      - "8011:8011"
    networks:
      - backend
    deploy:
      placement:
        constraints:
          - node.labels.role == compute
      resources:
        limits:
          memory: 256M
      restart_policy:
        condition: any
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 30s
        order: start-first
      rollback_config:
        parallelism: 1
        order: start-first

  # ─── Observability (role=compute / server_7) ──────────────────────────

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
    configs:
      - source: prometheus-config
        target: /etc/prometheus/prometheus.yml
      - source: prometheus-alerts
        target: /etc/prometheus/alerts.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    networks:
      - backend
    deploy:
      placement:
        constraints:
          - node.labels.role == compute
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M
      restart_policy:
        condition: any

  alertmanager:
    image: prom/alertmanager:latest
    ports:
      - "9093:9093"
    configs:
      - source: alertmanager-config
        target: /etc/alertmanager/alertmanager.yml
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    networks:
      - backend
    deploy:
      placement:
        constraints:
          - node.labels.role == compute
      resources:
        limits:
          memory: 128M
      restart_policy:
        condition: any

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3100:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:?GF_ADMIN_PASSWORD must be set}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - backend
    deploy:
      placement:
        constraints:
          - node.labels.role == compute
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M
      restart_policy:
        condition: any

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    ports:
      - "4317:4317"
      - "4318:4318"
    configs:
      - source: otel-config-v2
        target: /etc/otelcol-contrib/config.yaml
    networks:
      - backend
    deploy:
      placement:
        constraints:
          - node.labels.role == compute
      resources:
        limits:
          memory: 256M
      restart_policy:
        condition: any

# ═══════════════════════════════════════════════════════════════════════
# Networks, Volumes, Secrets, Configs
# ═══════════════════════════════════════════════════════════════════════

networks:
  backend:
    driver: overlay
    attachable: true

volumes:
  postgres_data:
  minio_data:
  prometheus_data:
  grafana_data:

configs:
  prometheus-config:
    file: ./observability/prometheus.yml
  prometheus-alerts:
    file: ./observability/alerts.yml
  alertmanager-config:
    file: ./observability/alertmanager.yml
  otel-config-v2:
    file: ./observability/otel-collector.yml
