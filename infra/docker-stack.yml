      NATS_URL: ${NATS_URL:?NATS_URL must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_EXPIRES_IN: 24h
      ALPACA_API_KEY: ${ALPACA_API_KEY:?ALPACA_API_KEY must be set}
      ALPACA_API_SECRET: ${ALPACA_API_SECRET:?ALPACA_API_SECRET must be set}
      KEYCLOAK_URL: ${KEYCLOAK_URL:?KEYCLOAK_URL must be set}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:?KEYCLOAK_REALM must be set}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:?KEYCLOAK_CLIENT_ID must be set}
      ENVIRONMENT: production
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:?OTEL_EXPORTER_OTLP_ENDPOINT must be set}
      AUTH_PORT: "3001"
    ports:
      - "3001:3001"
    networks:
      - backend
    deploy:
      placement:
        constraints:
          - node.labels.role == trading
      resources:
        limits:
          memory: 256M
      restart_policy:
        condition: any
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 30s
        order: start-first
      rollback_config:
        parallelism: 1
        order: start-first

